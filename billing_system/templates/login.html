<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HotspotPro</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); position:relative; overflow:hidden; }
    .hex-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .hex-item { position:absolute; clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); animation:hexFloat 8s ease-in-out infinite; opacity:0.04; }
    @keyframes hexFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-20px) rotate(15deg)} }
    .login-wrap { position:relative; z-index:1; width:100%; max-width:420px; padding:20px; }
    .login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .login-header { background:linear-gradient(135deg,#0a0e1a 0%,#1a1d27 100%); padding:32px; text-align:center; border-bottom:1px solid var(--border); }
    .login-logo h1 { font-family:'Arial Black','Arial Bold',Gadget,sans-serif; font-size:26px; font-weight:900; color:var(--accent); letter-spacing:-1px; }
    .login-logo p { color:var(--muted); font-size:12px; margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
    .login-body { padding:32px; }
    .tab-switch { display:flex; background:var(--surface2); border-radius:8px; padding:4px; margin-bottom:24px; gap:4px; }
    .tab-btn { flex:1; padding:8px; border:none; background:none; color:var(--muted); font-size:13px; font-weight:600; border-radius:6px; cursor:pointer; font-family:'Arial',sans-serif; transition:all 0.15s; }
    .tab-btn.active { background:var(--accent); color:#0f1117; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; font-family:'Arial',sans-serif; }
    .form-group input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text); font-size:14px; font-family:'Arial',sans-serif; transition:border-color 0.15s; }
    .form-group input:focus { outline:none; border-color:var(--accent); }
    .btn-login { width:100%; padding:12px; background:var(--accent); color:#0f1117; border:none; border-radius:8px; font-size:15px; font-weight:900; font-family:'Arial Black','Arial Bold',Gadget,sans-serif; cursor:pointer; margin-top:8px; transition:background 0.15s; }
    .btn-login:hover { background:#00c98a; }
    .error-box { background:rgba(255,77,109,0.1); border:1px solid rgba(255,77,109,0.3); color:var(--danger); padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:20px; }
    .register-link { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
    .register-link a { color:var(--accent); text-decoration:none; font-weight:600; }
    .security-note { text-align:center; margin-top:16px; font-size:11px; color:var(--muted); }
    .forgot-link { text-align:right; margin-top:-10px; margin-bottom:16px; }
    .forgot-link a { font-size:12px; color:var(--muted); text-decoration:none; }
    .forgot-link a:hover { color:var(--accent); }
  </style>
</head>
<body>
  <!-- Animated hexagon background -->
  <div class="hex-bg" id="hex-bg"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">
          <h1>⚡ HotspotPro</h1>
          <p>Professional WiFi Billing Platform</p>
        </div>
      </div>

      <div class="login-body">
        <!-- Tab switch -->
        <div class="tab-switch">
          <button class="tab-btn active" id="tab-isp" onclick="switchTab('isp')">
            📡 ISP Login
          </button>
          <button class="tab-btn" id="tab-admin" onclick="switchTab('admin')">
            🔐 Admin Login
          </button>
        </div>

        {% if error %}
        <div class="error-box">🔒 {{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/login" id="login-form">
          <div class="form-group">
            <label>Username or Email</label>
            <input type="text" name="username" id="username-input"
                   placeholder="your@email.com" required autofocus
                   value="{{ username or '' }}">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="••••••••" required>
          </div>
          <div class="forgot-link">
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn-login" id="login-btn">
            🚀 Sign In
          </button>
        </form>

        <div class="register-link">
          New ISP? <a href="/isp/register">Create your account →</a>
        </div>

        <div class="security-note">
          🛡️ All login attempts are monitored and logged.<br>
          5 failed attempts will lock your account.
        </div>
      </div>
    </div>
  </div>

  <script>
    // Animated hexagons
    const bg = document.getElementById('hex-bg');
    const colors = ['#00e5a0','#5b6af0','#ffb547'];
    for(let i=0;i<15;i++){
      const hex=document.createElement('div');
      const size=30+Math.random()*80;
      hex.className='hex-item';
      hex.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[i%3]};animation-delay:${Math.random()*5}s;animation-duration:${6+Math.random()*6}s;`;
      bg.appendChild(hex);
    }

    function switchTab(tab) {
      const ispBtn   = document.getElementById('tab-isp');
      const adminBtn = document.getElementById('tab-admin');
      const input    = document.getElementById('username-input');
      const btn      = document.getElementById('login-btn');
      if(tab === 'isp'){
        ispBtn.classList.add('active');
        adminBtn.classList.remove('active');
        input.placeholder = 'your@email.com';
        btn.textContent = '🚀 Sign In to Dashboard';
      } else {
        adminBtn.classList.add('active');
        ispBtn.classList.remove('active');
        input.placeholder = 'admin';
        btn.textContent = '🔐 Admin Sign In';
      }
    }
  </script>
</body>
</html>
