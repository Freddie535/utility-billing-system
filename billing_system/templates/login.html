<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HotspotPro</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo h1 { font-family: var(--font-display); font-size: 28px; font-weight: 800; color: var(--accent); }
    .login-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .login-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .form-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 14px; font-family: var(--font-body); transition: border-color 0.15s; }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn-login { width: 100%; padding: 12px; background: var(--accent); color: #0f1117; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; font-family: var(--font-body); cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .btn-login:hover { background: #00c98a; }
    .error-box { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .security-note { text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); }
    .attempts-warning { background: rgba(255,181,71,0.1); border: 1px solid rgba(255,181,71,0.3); color: var(--warning); padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <h1>⚡ HotspotPro</h1>
      <p>Secure Billing Dashboard</p>
    </div>

    {% if error %}
    <div class="error-box">🔒 {{ error }}</div>
    {% endif %}

    {% if warning %}
    <div class="attempts-warning">⚠️ {{ warning }}</div>
    {% endif %}

    <div class="login-title">Sign in to your account</div>

    <form method="POST" action="/auth/login">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="username" placeholder="admin" required autofocus
               value="{{ username or '' }}">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">🔐 Sign In</button>
    </form>

    <div class="security-note">
      🛡️ Protected by HotspotPro Security<br>
      All login attempts are monitored and logged
    </div>
  </div>
</body>
</html>
