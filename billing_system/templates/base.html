<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WiFi Billing{% endblock %} — HotspotPro</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>⚡ HotspotPro</h1>
      <p>Billing Dashboard</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
        <span class="icon">📊</span> Dashboard
      </a>
      <a href="/customers" class="nav-item {% if active == 'customers' %}active{% endif %}">
        <span class="icon">👥</span> Customers
      </a>
      <a href="/packages" class="nav-item {% if active == 'packages' %}active{% endif %}">
        <span class="icon">📦</span> Packages
      </a>
      <div class="nav-label" style="margin-top:12px;">Billing</div>
      <a href="/invoices" class="nav-item {% if active == 'invoices' %}active{% endif %}">
        <span class="icon">🧾</span> Invoices
      </a>
      <a href="/payments" class="nav-item {% if active == 'payments' %}active{% endif %}">
        <span class="icon">💳</span> Payments
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
